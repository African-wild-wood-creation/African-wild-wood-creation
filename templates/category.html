{% extends "base.html" %}
{% block title %} Products - {{ category.name.capitalize() }} {% endblock %}
{% block content %}
  <div class="search-wrapper mt-4">
    <div class="search-container">
      <span class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#1E0C06"><path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/></svg>
      </span>
      <form>
        <input type="text" placeholder="Search..." class="search-input">
        </div>
        <button type="submit" class="search-button">Search</button>
    </form>
  </div>
</section>
<div>
    <h1 class="heading mt-4">{{ category.name.capitalize() }}</h1>
<div class="container-fluid mt-4">
  <div class="row g-4 product-grid">

    {% for product in products %}
    <div class="col-6 col-md-4 col-lg-3 col-xl-2-4">

      <div class="category-product-card">

        <div class="category-product-image">
          <img src="{{ url_for('static',  filename='images/' ~ product.img_url)}}" alt="{{ product.name }}">
        </div>

        <h6 class="category-product-title">
          {{ product.name }}
        </h6>

        <p class="category-product-price">
          £{{ product.price }}
        </p>

        <button class="btn category-add-btn">
          Add to Cart
        </button>

      </div>
    </div>
    {% endfor %}

  </div>
</div>

</div>
{% endblock %}
